# Hourly fast-forward of this fork's main to the upstream seedds/nxnative.
# The job only ever fast-forwards: if the fork has commits upstream does not have,
# it fails instead of discarding them. Run it by hand from the Actions tab when needed.
# Pushes made with GITHUB_TOKEN do not trigger other workflows; set a SYNC_TOKEN
# secret (a PAT with contents:write) if the push should start the normal CI runs.
name: sync-upstream

on:
  schedule:
    - cron: '17 * * * *'   # off the hour to avoid GitHub's peak-time scheduling delays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), as in tests.yml.
jobs:
  sync:
    name: fast-forward main from seedds/nxnative
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main to upstream
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/seedds/nxnative.git
          git fetch --no-tags upstream main

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Already up to date."
            exit 0
          fi

          if ! git merge --ff-only FETCH_HEAD; then
            echo "::error::main has diverged from seedds/nxnative. Rebase or merge the fork's own commits by hand, then rerun."
            exit 1
          fi

          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          {
            echo "Fast-forwarded \`main\` to \`$(git rev-parse --short FETCH_HEAD)\`:"
            echo '```'
            git log --oneline --no-decorate "${GITHUB_SHA}..FETCH_HEAD" | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
